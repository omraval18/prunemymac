[package]
name = "prunemymac"
version.workspace = true
edition.workspace = true

[dependencies]
macscrap-core = { path = "../macscrap-core", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
