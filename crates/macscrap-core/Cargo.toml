[package]
name = "macscrap-core"
version.workspace = true
edition.workspace = true

[features]
default = ["malware"]
malware = ["dep:yara-x"]

[dependencies]
rayon = "1.12"
glob = "0.3"
blake3 = { version = "1.8", features = ["mmap", "rayon"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
plist = "1.10"
serde = { version = "1", features = ["derive"] }
toml = "1"
sysinfo = "0.39"
trash = "5.2"
libc = "0.2"
yara-x = { version = "1.22", optional = true, default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "macho-module", "hash-module", "math-module", "string-module", "time-module", "console-module"] }
