[package]
name = "macscrap-core"
version.workspace = true
edition.workspace = true

[features]
default = ["malware"]
malware = ["dep:yara-x"]

[dependencies]
rayon = "1.12"
glob = "0.3"
# mmap yes; rayon no — nested parallel hashing fights the walk pool and inflates the binary.
blake3 = { version = "1.8", default-features = false, features = ["std", "mmap"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
plist = "1.10"
serde = { version = "1", features = ["derive"] }
toml = "1"
sysinfo = "0.39"
trash = "5.2"
libc = "0.2"
# Optional so the GUI can ship without cranelift/wasmtime. Both elf + macho so
# macOS and Linux builds share one dependency graph; console-module omitted.
yara-x = { version = "1.22", optional = true, default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "elf-module", "macho-module", "hash-module", "math-module", "string-module", "time-module"] }

[[bin]]
name = "prunemymac-protect"
path = "src/bin/prunemymac-protect.rs"
required-features = ["malware"]
