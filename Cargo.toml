[workspace]
resolver = "2"
members = ["crates/macscrap-core", "crates/macscrap"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# GPUI's async tar dependency uses xattr 0.2, whose Linux ENOATTR alias is
# absent from current libc. Keep its upstream code with the Linux fix.
xattr = { path = "vendor/xattr" }
